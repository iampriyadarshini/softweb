<html>
<title>Restaurant Title</title>

<head>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            
        }
    


        .main {
            width: 99%;
            height: 99%;
            background-color: bisque;
            justify-content: center;
            border: 2px solid black;
            border-radius: 20px;
            background-image: url("back.png");
            background-repeat: no-repeat;
            background-size: cover;
        }

        .main h1 {
            width: 500px;
            position: relative;
            top: 1px;
            left: 480px;
            border-radius: 100px;
            padding: 5px;
            background-color: black;
            color: white;
            font-family: 'Times New Roman', Times, serif;
            font-size: 50px;
        }

        .home {
            background-color: rgb(4, 4, 19);
            color: aliceblue;
            border: 2px solid black;
            border-radius: 50px;
            width: 90%;
            position: absolute;
            top: 120px;
            left: 70px;
            display: flex;
            justify-content: space-evenly;
        }

        .h1 {
            margin: 20px;
            padding: 20px;
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: x-large;
        }

        .contents {
            display: flex;
            align-items: center;
            flex-direction: row;
            justify-content: space-around;
            width: 91%;
            height: 400px;
            position: relative;
            top: 100px;
            left: 60px;
            background-color: rgb(228, 160, 2);
            border-radius: 70px;
        }

        .box {
            width: 22%;
            height: 90%;
            background-color: #1a237e;
            border-radius: 50px;
            padding: 10px;
            text-align: center;
        }

        h2 {
            color: white;
            background-color: black;
            width: 90%;
            height: 40px;
            border-radius: 80px;
            text-align: center;
            padding-top: 5px;
            margin: auto;
            font-size: 20px;
        }

        .box img {
            width: 90%;
            height: 250px;
            border-radius: 30px;
            margin-top: 15px;
            object-fit: cover;
        }

        .foot {
            border: 2px;
            width: 25%;
            border-radius: 60px;
            background-color: black;
            color: white;
            position: relative;
            bottom: -250px;
            left: 550px;
        }
    </style>
</head>

<body>
    <div class="main">
        <h1 align="center">PD</h1>

        <div class="home">
            <div class="h1"><a href="home.html">Home</a></div>
            <div class="h1"><a href="menu.html">Menu</a></div>
            <div class="h1"><a href="admin.html">Administration</a></div>
            <div class="h1"><a href="help.html">Contact Us</a></div>
        </div>

        <div class="contents">

            <!-- RESERVATION BOX -->
            <div class="box">
                <h2>RESERVATION</h2>
                <img src="re.png" alt="Reservation">
            </div>

            <!-- NEW ITEM BOX -->
            <div class="box">
                <h2>NEW ITEM</h2>
                <img src="new item.webp" alt="New Item">
            </div>

            <!-- DISCOUNTS BOX -->
            <div class="box">
                <h2>DISCOUNTS</h2>
                <img src="dis.png" alt="Discount">
            </div>

        </div>

        <div class="foot">
            <h3 align="center">Designed and Developed By PRIYADARSHINI K</h3>
        </div>
    </div>
</body>

</html>
