<!DOCTYPE html>
<html>
<head>
    <title>Menu Items</title>

    <style>
        .main {
            width: 99%;
            height: 99%;
            border: 2px solid black;
            border-radius: 20px;
            background-image: url("back.png");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            padding-bottom: 50px;
        }

        .main h1 {
            width: 500px;
            margin: 20px auto;
            border-radius: 100px;
            padding: 10px;
            background-color: black;
            color: white;
            font-family: 'Times New Roman', Times, serif;
            font-size: 50px;
            text-align: center;
        }

        .row {
            display: flex;
            justify-content: space-around;
            width: 95%;
            margin: auto;
            margin-top: 20px;
        }

        .item {
            width: 20%;
            height: 350px;
            background-color: darkblue;
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            border: 2px solid black;
            text-align: center;
        }

        .item img {
            width: 100%;
            height: 85%;
            object-fit: cover;
            border-radius: 30px 30px 0 0;
        }

        .item h2 {
            background-color: black;
            color: white;
            width: 90%;
            margin: 8px auto;
            padding: 5px;
            border-radius: 30px;
            font-size: 18px;
        }
    </style>

</head>
<body>

    <div class="main">

        <h1>MENU</h1>

        <!-- FIRST ROW -->
        <div class="row">
            <div class="item">
                <img src="dosa.png" alt="Dosa">
                <h2>DOSA</h2>
            </div>

            <div class="item">
                <img src="idly.png" alt="Idly">
                <h2>IDLY</h2>
            </div>

            <div class="item">
                <img src="bonda.png" alt="Bonda">
                <h2>SAMBAR BONDA</h2>
            </div>

            <div class="item">
                <img src="parrotta.png" alt="Parotta">
                <h2>PAROTA</h2>
            </div>

            <div class="item">
                <img src="pongal.png" alt="Pongal">
                <h2>PONGAL</h2>
            </div>
        </div>

        <!-- SECOND ROW -->
        <div class="row">

            <div class="item">
                <img src="chapathi.png" alt="Chapathi">
                <h2>CHAPATHI</h2>
            </div>

            <div class="item">
                <img src="idiyappam.png" alt="Idiyappam">
                <h2>IDIYAPPAM</h2>
            </div>

            <div class="item">
                <img src="onion dosa.png" alt="Onion Dosa">
                <h2>ONION DOSA</h2>
            </div>

            <div class="item">
                <img src="panniyaram.png" alt="Paniyaram">
                <h2>KARA PANIYARAM</h2>
            </div>

        </div>

    </div>

</body>
</html>
